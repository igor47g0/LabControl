<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="225" r="200" fill="url(#glowGrad)"/>

  <!-- Futuristic Grid -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="360" x2="550" y2="360"/>
    <line x1="80" y1="390" x2="520" y2="390"/>
    <line x1="120" y1="420" x2="480" y2="420"/>
    <line x1="100" y1="340" x2="160" y2="430"/>
    <line x1="200" y1="340" x2="230" y2="430"/>
    <line x1="300" y1="340" x2="300" y2="430"/>
    <line x1="400" y1="340" x2="370" y2="430"/>
    <line x1="500" y1="340" x2="440" y2="430"/>
  </g>

  <!-- Main Digital Laboratory Central Unit -->
  <g filter="url(#shadow)">
    <!-- Main glass device panel -->
    <rect x="130" y="70" width="340" height="270" rx="20" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Top device header bar -->
    <rect x="130" y="70" width="340" height="38" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
    <circle cx="155" cy="89" r="5" fill="#ef4444"/>
    <circle cx="172" cy="89" r="5" fill="#f59e0b"/>
    <circle cx="189" cy="89" r="5" fill="#10b981"/>
    
    <text x="240" y="93" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">LABCONTROL_NODE_01</text>
    <rect x="420" y="81" width="36" height="16" rx="8" fill="#064e3b"/>
    <text x="428" y="93" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">LIVE</text>

    <!-- Waveform / Spectrum graph -->
    <g transform="translate(150, 125)">
      <rect width="300" height="75" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <path d="M 10 38 Q 45 10, 80 40 T 150 35 T 220 55 T 290 25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M 10 38 Q 45 10, 80 40 T 150 35 T 220 55 T 290 25 L 290 70 L 10 70 Z" fill="#38bdf8" opacity="0.12"/>
      <!-- Grid ticks inside graph -->
      <line x1="80" y1="10" x2="80" y2="70" stroke="#1e293b" stroke-dasharray="2,2"/>
      <line x1="150" y1="10" x2="150" y2="70" stroke="#1e293b" stroke-dasharray="2,2"/>
      <line x1="220" y1="10" x2="220" y2="70" stroke="#1e293b" stroke-dasharray="2,2"/>
    </g>

    <!-- Equipment Status Indicators -->
    <g transform="translate(150, 220)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
      <circle cx="18" cy="25" r="8" fill="#0369a1"/>
      <text x="35" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">PAT-00101</text>
      <text x="35" y="38" fill="#34d399" font-family="sans-serif" font-size="9">Qtd: 12 unidades</text>

      <!-- Item 2 -->
      <rect x="160" y="0" width="140" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
      <circle cx="178" cy="25" r="8" fill="#047857"/>
      <text x="195" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">PAT-00102</text>
      <text x="195" y="38" fill="#38bdf8" font-family="sans-serif" font-size="9">Qtd: 5 unidades</text>

      <!-- Item 3 mini row -->
      <rect x="0" y="60" width="300" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11">Status MySQL DB:</text>
      <text x="120" y="85" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">CONNECTED (port 3306)</text>
      <circle cx="280" cy="81" r="5" fill="#34d399"/>
    </g>
  </g>

  <!-- Floating Holographic Glass Cards -->
  <!-- Floating Card Left: Equipment Inspection -->
  <g transform="translate(45, 140)" filter="url(#shadow)">
    <rect width="130" height="110" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" opacity="0.95"/>
    <circle cx="35" cy="35" r="16" fill="url(#blueG)"/>
    <!-- Flask icon -->
    <path d="M 31 28 L 39 28 L 41 34 L 43 42 H 27 L 29 34 Z" fill="#ffffff"/>
    <text x="15" y="70" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Microscópio</text>
    <text x="15" y="86" fill="#94a3b8" font-family="sans-serif" font-size="10">Optica 4K</text>
    <rect x="15" y="93" width="55" height="12" rx="4" fill="#065f46"/>
    <text x="20" y="102" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="700">ATIVO</text>
  </g>

  <!-- Floating Card Right: Validation & Security -->
  <g transform="translate(425, 230)" filter="url(#shadow)">
    <rect width="135" height="120" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <circle cx="35" cy="35" r="16" fill="url(#accentG)"/>
    <!-- Shield / Check icon -->
    <path d="M 28 35 L 33 40 L 42 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="15" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Patrimônio Único</text>
    <text x="15" y="86" fill="#94a3b8" font-family="sans-serif" font-size="10">Validação @Column</text>
    <text x="15" y="102" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">409 CONFLICT</text>
  </g>

  <!-- Laser / Data transmission lines -->
  <path d="M 175 195 C 150 170, 100 200, 110 240" fill="none" stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 470 230 C 500 210, 520 270, 490 290" fill="none" stroke="#34d399" stroke-dasharray="4,4" opacity="0.6"/>
</svg>
